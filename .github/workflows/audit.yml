name: Package audit

# Advisories are published between pushes, so CI alone would only notice one at the next commit.
# This repeats the same check weekly and fails — which notifies the repository's watchers — when a
# package the service resolves has become vulnerable.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: No known vulnerable packages
        run: scripts/audit-packages.sh
