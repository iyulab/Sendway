name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The one integration test sends a real message over SMTP to this catcher (see README).
    services:
      smtp4dev:
        image: rnwood/smtp4dev
        ports:
          - 2525:25
      # The database the service runs on. The suite defaults to SQLite; the last step repeats the
      # storage tests here so the migrations and the provider-specific SQL are exercised too.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: No known vulnerable packages
        run: scripts/audit-packages.sh

      # Warnings fail CI: nothing else would notice them piling up.
      - run: dotnet build Sendway.slnx --configuration Release -p:TreatWarningsAsErrors=true

      # The build rewrites the API description; a contract change must arrive with its description.
      - name: OpenAPI description is up to date
        run: git diff --exit-code -- docs/openapi.json

      - run: dotnet test Sendway.slnx --configuration Release --no-build

      - name: Storage tests against PostgreSQL
        run: dotnet test tests/Sendway.Core.Tests --configuration Release --no-build
        env:
          SENDWAY_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres
